name: build

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write        # sürüm dosyalarını yüklemek için
      id-token: write        # derleme kaynağı kaydı (attestation) için
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        shell: pwsh
        run: |
          $info = Get-Content src/AssemblyInfo.cs -Raw
          $v = [regex]::Match($info, 'AssemblyInformationalVersion\("([^"]+)"\)').Groups[1].Value
          if (-not $v) { throw 'AssemblyInformationalVersion bulunamadı' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Etiket ($env:GITHUB_REF_NAME) ile program sürümü (v$v) aynı değil"
          }
          # kanal: "stable" (main) ya da "preview" (develop) -> GitHub'da ön sürüm olarak yayınlanır
          $ch = [regex]::Match($info, 'Channel\s*=\s*"([^"]+)"').Groups[1].Value
          if (-not $ch) { $ch = 'stable' }
          "version=$v" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($ch -eq 'stable') { 'false' } else { 'true' })" >> $env:GITHUB_OUTPUT
          Write-Host "Sürüm $v, kanal $ch"

      - name: Verify driver package
        shell: pwsh
        run: |
          # .inf'in bugünkü baytları katalogdaki özetle aynı olmalı (satır sonu değişirse sürücü kurulamaz)
          $cat = [BitConverter]::ToString([IO.File]::ReadAllBytes('driver/package/brokenscreenresizervdd.cat')).Replace('-', '')
          $h = (Get-FileHash driver/package/BrokenScreenResizerVDD.inf -Algorithm SHA256).Hash
          if (-not $cat.Contains($h)) { throw 'driver/package/BrokenScreenResizerVDD.inf katalogdaki özetle uyuşmuyor (satır sonları değişmiş olabilir)' }
          Write-Host 'Sürücü paketi katalogla uyumlu.'

      - name: Build
        shell: cmd
        run: build.bat ci

      - name: Install Inno Setup 6.7.3
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\innosetup-6.7.3.exe"
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw "Inno Setup özeti beklenenden farklı: $hash" }
          Start-Process $exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /PORTABLE=1 /DIR=`"$env:RUNNER_TEMP\inno`"" -Wait

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Version ${{ steps.version.outputs.version }} -Iscc "$env:RUNNER_TEMP\inno\ISCC.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrokenScreenResizer-${{ steps.version.outputs.version }}
          path: dist/*

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ steps.version.outputs.prerelease }}
          make_latest: ${{ steps.version.outputs.prerelease == 'true' && 'false' || 'true' }}
