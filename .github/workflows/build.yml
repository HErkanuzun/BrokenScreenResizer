name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.bat ci

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrokenScreenResizer
          path: bin/BrokenScreenResizer.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/BrokenScreenResizer.exe
